name: macOS Apple Silicon port
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'platform/macos/**'
      - 'scripts/**'
      - '*.props'
      - '*.slnx'
      - 'global.json'
      - '.github/workflows/macos.yml'
permissions:
  contents: read
jobs:
  build-and-unit-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
      - name: Build, unit-test and publish osx-arm64
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OrthoStreamXP-macos-arm64-unsigned
          path: artifacts/macos-arm64/
  # A hosted runner does not prove macFUSE works. Run scripts/smoke-macos.sh
  # on an Apple Silicon Mac with an approved macFUSE installation before PR review.
